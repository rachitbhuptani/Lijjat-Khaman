<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Corporate food-pack orders — Lijjat Khaman, Ahmedabad. Customised platters since 1995.">

<style>
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --night:#0F1422;
  --lk-green:#1B7B3D;
  --lk-green-d:#0E5226;
  --lk-yellow:#F8CC1B;
}
html{ scroll-behavior:smooth; }
body{
  font-family:'Outfit',sans-serif;
  background:var(--night);
  color:#fff;
  overflow-x:hidden;
}

/* grid */
#grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:88px 88px;
}

/* topbar */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:rgba(10,14,24,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(248,204,27,.2);
}
.tb-brand{
  display:flex; align-items:center; gap:10px;
  text-decoration:none; flex-shrink:0;
}
.tb-brand img{ width:36px; height:auto; filter:drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
.tb-name{ font-family:'Gloock',serif; font-size:.9rem; color:#fff; line-height:1.2; }
.tb-label{
  font-family:'IBM Plex Mono',monospace; font-size:.45rem;
  letter-spacing:.26em; text-transform:uppercase; color:rgba(255,255,255,.45);
}
.tb-actions{ display:flex; align-items:center; gap:10px; }
.tb-btn{
  font-family:'IBM Plex Mono',monospace; font-size:.58rem;
  letter-spacing:.18em; text-transform:uppercase;
  padding:8px 16px; border:1px solid rgba(255,255,255,.22);
  background:transparent; color:rgba(255,255,255,.65);
  cursor:pointer; text-decoration:none; transition:color .2s, border-color .2s, background .2s;
  display:flex; align-items:center; gap:7px; white-space:nowrap;
}
.tb-btn:hover{ color:#fff; border-color:rgba(255,255,255,.55); }
.tb-btn.share{ color:var(--lk-yellow); border-color:rgba(248,204,27,.45); }
.tb-btn.share:hover{ background:rgba(248,204,27,.1); border-color:var(--lk-yellow); }
.tb-btn svg{ width:14px; height:14px; flex-shrink:0; }

/* pdf area */
#pdf-wrap{
  position:relative; z-index:1;
  padding-top:56px;
  min-height:100vh;
}
#pdf-container{
  width:100%; max-width:900px;
  margin:0 auto;
  display:flex; flex-direction:column; gap:0;
  user-select:none; -webkit-user-select:none;
}
#pdf-container canvas{ display:block; width:100% !important; height:auto !important; }

/* loading */
#pdf-loading{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:calc(100vh - 56px); gap:16px;
  font-family:'IBM Plex Mono',monospace; font-size:.6rem;
  letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.4);
}
.spinner{
  width:32px; height:32px; border:2px solid rgba(248,204,27,.2);
  border-top-color:var(--lk-yellow); border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* toast */
#toast{
  position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-10px);
  background:rgba(14,20,34,.96); border:1px solid rgba(248,204,27,.5);
  backdrop-filter:blur(12px); padding:10px 24px;
  font-family:'IBM Plex Mono',monospace; font-size:.62rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--lk-yellow);
  z-index:9999; pointer-events:none; white-space:nowrap;
  opacity:0; transition:opacity .3s, transform .3s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* inquire fab */
#fab-inquire{
  position:fixed; right:24px; bottom:28px; z-index:500;
  display:flex; align-items:center; gap:10px;
  background:var(--lk-green); color:#fff;
  text-decoration:none;
  border-radius:50px; padding:14px 22px 14px 16px;
  cursor:pointer; font-family:'Outfit',sans-serif;
  box-shadow:0 12px 34px rgba(27,123,61,.5), 0 2px 8px rgba(0,0,0,.3);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .2s;
  animation:bob 4s ease-in-out infinite;
}
#fab-inquire:hover{ background:#1d8a44; transform:translateY(-3px) scale(1.03); }
@keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
.fi-ic{
  width:34px; height:34px; border-radius:50%;
  background:var(--lk-yellow); color:var(--lk-green-d);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.fi-ic svg{ width:18px; height:18px; }
.fi-t{ font-size:.85rem; font-weight:600; letter-spacing:.01em; }
.fi-s{ font-size:.5rem; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(255,255,255,.7); margin-top:1px; }
@media(max-width:600px){
  #fab-inquire{ padding:12px 16px 12px 13px; }
  .fi-s{ display:none; }
}

</style>
</head>
<body>

<div id="grid"></div>

<!-- TOPBAR -->
<nav id="topbar">
  <a class="tb-brand" href="../">
    <img src="../logo-trans.png" alt="Lijjat Khaman logo">
    <div>
      <div class="tb-name">Lijjat Khaman</div>
      <div class="tb-label">Corporate Orders</div>
    </div>
  </a>
  <div class="tb-actions">
    <button id="share-btn" class="tb-btn share" title="Copy link to share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      Share Link
    </button>
    <a class="tb-btn" href="../">← Back</a>
  </div>
</nav>

<!-- TOAST -->
<div id="toast">Link copied!</div>

<!-- PDF VIEWER -->
<div id="pdf-wrap">
  <div id="pdf-loading">
    <div class="spinner"></div>
    <span>Loading brochure…</span>
  </div>
  <div id="pdf-container"></div>
</div>

<!-- INQUIRE NOW FAB — direct WhatsApp link -->
<a id="fab-inquire"
   href="https://wa.me/919909335200?text=Hi%20Lijjat%20Khaman!%20I'd%20like%20to%20inquire%20about%20a%20corporate%20order."
   target="_blank" rel="noopener" title="Chat with us on WhatsApp">
  <span class="fi-ic" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.86L.057 23.571a.75.75 0 0 0 .921.921l5.71-1.476A11.953 11.953 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.914 0-3.703-.538-5.223-1.47l-.375-.224-3.886 1.004 1.025-3.773-.244-.388A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
    </svg>
  </span>
  <span>
    <div class="fi-t">Inquire Now</div>
    <div class="fi-s">Chat on WhatsApp →</div>
  </span>
</a>

<script>
/* ── PDF.js renderer ── */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_SRC = '../Lijjat_Brochure_Final_21-08-26.pdf';

(async function renderPDF() {
  const loading   = document.getElementById('pdf-loading');
  const container = document.getElementById('pdf-container');
  try {
    const pdf = await pdfjsLib.getDocument(PDF_SRC).promise;
    const dpr = window.devicePixelRatio || 1;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page     = await pdf.getPage(p);
      const baseVP   = page.getViewport({ scale: 1 });
      const scale    = ((container.clientWidth || window.innerWidth) / baseVP.width) * dpr;
      const viewport = page.getViewport({ scale });
      const canvas   = document.createElement('canvas');
      canvas.width   = viewport.width;
      canvas.height  = viewport.height;
      canvas.style.width  = (viewport.width  / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      container.appendChild(canvas);
      if (p === 1) loading.style.display = 'none';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
    loading.style.display = 'none';
  } catch {
    loading.style.display = 'none';
    container.innerHTML = `<object
      data="../Lijjat_Brochure_Final_21-08-26.pdf"
      type="application/pdf"
      style="width:100%;height:calc(100vh - 56px);display:block;border:none;">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);">
        <span>Could not load brochure.</span>
        <a href="../Lijjat_Brochure_Final_21-08-26.pdf" style="color:var(--lk-yellow);text-decoration:none;border:1px solid rgba(248,204,27,.4);padding:10px 20px;">View PDF ↗</a>
      </div>
    </object>`;
  }
})();

/* disable right-click on PDF area */
document.getElementById('pdf-container').addEventListener('contextmenu', e => e.preventDefault());

/* ── Share via WhatsApp ── */
document.getElementById('share-btn').addEventListener('click', () => {
  const msg = `Hey! 👋 This looks really interesting — Lijjat Khaman has a corporate food-pack order option. Check out their brochure here:\n\nhttps://lijjatkhaman.com/corporate`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
});
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

</script>
</body>
