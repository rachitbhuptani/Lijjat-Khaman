<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketDesk — NSE / BSE Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════════════════ */
:root {
  --bg:        #050b17;
  --surface:   #0b1525;
  --card:      #0f1d30;
  --card2:     #122035;
  --border:    #1a2e4a;
  --border2:   #213756;
  --accent:    #3b82f6;
  --accent2:   #60a5fa;
  --text:      #dde8f5;
  --text2:     #8aa8cc;
  --muted:     #4a6885;
  --green:     #22d87a;
  --red:       #f05070;
  --yellow:    #f5a523;
  --font:      'Inter', system-ui, sans-serif;
  --mono:      'JetBrains Mono', 'Courier New', monospace;
  --r:         6px;
  --r2:        10px;
  --shadow:    0 4px 24px #00000066;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background:  var(--bg);
  color:       var(--text);
  min-height:  100vh;
  font-size:   14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ═══════════════════════════════════════════════════════════
   SCROLLBAR
══════════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track  { background: var(--surface); }
::-webkit-scrollbar-thumb  { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ═══════════════════════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════════════════════ */
.app-shell {
  display:        grid;
  grid-template-rows: auto auto 1fr;
  height:         100vh;
  max-height:     100vh;
  overflow:       hidden;
}

/* ═══════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════ */
.header {
  display:     flex;
  align-items: center;
  gap:         16px;
  padding:     0 20px;
  height:      56px;
  background:  var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position:    relative;
  z-index:     10;
}

.logo {
  display:     flex;
  align-items: center;
  gap:         10px;
  flex-shrink: 0;
}
.logo-mark {
  width:  32px;
  height: 32px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 16px #3b82f640;
}
.logo-text   { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
.logo-sub    { font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: .5px; text-transform: uppercase; margin-left: 2px; }

.header-mid { flex: 1; }

.header-right {
  display:     flex;
  align-items: center;
  gap:         12px;
  flex-shrink: 0;
}

.market-status {
  font-size:  12px;
  font-weight: 600;
  padding:    4px 10px;
  border-radius: 20px;
  letter-spacing: .3px;
}
.market-status.open   { color: var(--green); background: #22d87a18; border: 1px solid #22d87a33; }
.market-status.closed { color: var(--muted); background: #ffffff08; border: 1px solid var(--border); }

#clock {
  font-family: var(--mono);
  font-size:   13px;
  color:       var(--text2);
  letter-spacing: 1px;
}

.refresh-btn {
  display:     flex;
  align-items: center;
  gap:         7px;
  padding:     7px 14px;
  border-radius: var(--r);
  background:  var(--card);
  border:      1px solid var(--border);
  color:       var(--text2);
  font-size:   13px;
  font-weight: 500;
  transition:  all .2s;
}
.refresh-btn:hover:not(:disabled) {
  background: var(--card2);
  border-color: var(--accent);
  color: var(--accent2);
}
.refresh-btn:disabled { opacity: .5; pointer-events: none; }

.refresh-icon {
  font-size:  15px;
  display:    inline-block;
  transition: transform .3s;
}
.refresh-icon.spinning { animation: spin .7s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

#last-updated {
  font-size: 11px;
  color: var(--muted);
}

/* ═══════════════════════════════════════════════════════════
   SUMMARY STRIP
══════════════════════════════════════════════════════════ */
.summary-strip {
  display:    flex;
  gap:        1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height:     52px;
}

.stat-card {
  flex:        1;
  display:     flex;
  align-items: center;
  gap:         12px;
  padding:     0 20px;
  background:  var(--surface);
}
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; }
.stat-val   { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.stat-val.green { color: var(--green); }
.stat-val.red   { color: var(--red); }

/* ═══════════════════════════════════════════════════════════
   MAIN AREA
══════════════════════════════════════════════════════════ */
.main-area {
  display:  grid;
  grid-template-columns: 1fr 360px;
  overflow: hidden;
  height:   100%;
}

/* ═══════════════════════════════════════════════════════════
   SCREENER PANEL (left)
══════════════════════════════════════════════════════════ */
.screener-panel {
  display:  flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.screener-toolbar {
  display:     flex;
  align-items: center;
  gap:         10px;
  padding:     10px 16px;
  border-bottom: 1px solid var(--border);
  background:  var(--surface);
  flex-shrink: 0;
  flex-wrap:   wrap;
}

.search-wrap {
  position:   relative;
  flex-shrink: 0;
}
.search-icon {
  position:   absolute;
  left:       10px;
  top:        50%;
  transform:  translateY(-50%);
  color:      var(--muted);
  font-size:  13px;
  pointer-events: none;
}
#search {
  padding:     7px 10px 7px 30px;
  border-radius: var(--r);
  background:  var(--card);
  border:      1px solid var(--border);
  color:       var(--text);
  font-size:   13px;
  font-family: inherit;
  width:       180px;
  outline:     none;
  transition:  border-color .2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }

#sector-filters {
  display:  flex;
  gap:      6px;
  flex-wrap: wrap;
}

.filter-chip {
  padding:     4px 11px;
  border-radius: 20px;
  font-size:   12px;
  font-weight: 500;
  color:       var(--text2);
  background:  transparent;
  border:      1px solid var(--border);
  transition:  all .15s;
}
.filter-chip:hover { border-color: var(--sc, var(--accent)); color: var(--sc, var(--accent2)); }
.filter-chip.active {
  background: var(--sc, var(--accent));
  border-color: var(--sc, var(--accent));
  color: #fff;
  box-shadow: 0 0 12px color-mix(in srgb, var(--sc, var(--accent)) 40%, transparent);
}

/* Table */
.table-wrap {
  overflow: auto;
  flex: 1;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead { position: sticky; top: 0; z-index: 2; }

th {
  background:  var(--surface);
  border-bottom: 1px solid var(--border);
  padding:     10px 12px;
  text-align:  left;
  font-size:   11px;
  font-weight: 600;
  color:       var(--muted);
  letter-spacing: .5px;
  text-transform: uppercase;
  white-space: nowrap;
  user-select: none;
}

.sort-th { cursor: pointer; transition: color .15s; }
.sort-th:hover { color: var(--text); }
.sort-th::after { content: ''; margin-left: 5px; opacity: .4; font-size: 10px; }
.sort-th.desc::after { content: '▼'; opacity: 1; color: var(--accent2); }
.sort-th.asc::after  { content: '▲'; opacity: 1; color: var(--accent2); }

td {
  padding:     10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  white-space: nowrap;
}
.stock-row { transition: background .12s; cursor: pointer; }
.stock-row:hover    { background: var(--card); }
.stock-row.selected { background: #3b82f610; }
.stock-row.selected td:first-child { border-left: 2px solid var(--accent); }

.sym-cell { display: flex; align-items: center; gap: 6px; }

.sym-badge {
  font-family: var(--mono);
  font-size:   12px;
  font-weight: 500;
  color:       var(--text);
  border:      1px solid var(--border2);
  padding:     2px 7px;
  border-radius: 4px;
  letter-spacing: .5px;
}

.exch-pill {
  font-size:   10px;
  font-weight: 600;
  color:       var(--muted);
  letter-spacing: .5px;
  text-transform: uppercase;
}

.name-col  { max-width: 180px; overflow: hidden; text-overflow: ellipsis; color: var(--text2); }
.price-col { font-weight: 600; color: var(--text); }
.vol-col   { color: var(--text2); }

.mono  { font-family: var(--mono); font-size: 12.5px; }
.up    { color: var(--green); }
.down  { color: var(--red); }
.muted { color: var(--muted); }

.chg-arrow { font-size: 9px; margin-right: 3px; }

/* 52W range bar */
.range-wrap {
  display:     flex;
  align-items: center;
  gap:         6px;
  font-size:   10px;
  color:       var(--muted);
}
.range-bar {
  position:   relative;
  width:      80px;
  height:     4px;
  background: var(--border2);
  border-radius: 2px;
  flex-shrink: 0;
}
.range-fill {
  position:   absolute;
  left:       0; top: 0;
  height:     100%;
  background: linear-gradient(90deg, var(--red), var(--yellow), var(--green));
  border-radius: 2px;
}
.range-dot {
  position:    absolute;
  top:         50%;
  transform:   translate(-50%, -50%);
  width:       8px;
  height:      8px;
  background:  var(--text);
  border:      2px solid var(--bg);
  border-radius: 50%;
}
.range-lo, .range-hi { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.sector-tag {
  font-size:   11px;
  font-weight: 500;
  padding:     2px 8px;
  border-radius: 4px;
  border:      1px solid transparent;
  white-space: nowrap;
}

/* Skeleton loading */
.sk-line {
  display:  inline-block;
  width:    70px;
  height:   12px;
  background: linear-gradient(90deg, var(--card), var(--card2), var(--card));
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 3px;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.empty-cell { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

/* ═══════════════════════════════════════════════════════════
   NEWS PANEL (right)
══════════════════════════════════════════════════════════ */
.news-panel {
  display:       flex;
  flex-direction: column;
  background:    var(--surface);
  overflow:      hidden;
}

.news-header {
  padding:      12px 16px 0;
  border-bottom: 1px solid var(--border);
  flex-shrink:  0;
  background:   var(--surface);
}

.news-title-row {
  display:     flex;
  align-items: baseline;
  gap:         8px;
  margin-bottom: 10px;
}
.news-title { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .2px; }
#news-count {
  font-size:   11px;
  background:  var(--card);
  color:       var(--muted);
  padding:     1px 7px;
  border-radius: 10px;
  font-family: var(--mono);
  border: 1px solid var(--border);
}
.news-hint {
  font-size: 10.5px;
  color: var(--muted);
  margin-left: auto;
}

#news-tabs {
  display:    flex;
  gap:        2px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}
#news-tabs::-webkit-scrollbar { display: none; }

.news-tab {
  padding:     6px 12px;
  font-size:   12px;
  font-weight: 500;
  color:       var(--muted);
  border-bottom: 2px solid transparent;
  transition:  all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.news-tab:hover { color: var(--text); }
.news-tab.active {
  color:        var(--sc, var(--accent2));
  border-bottom-color: var(--sc, var(--accent));
}

#news-list {
  flex:     1;
  overflow: auto;
  padding:  8px;
  display:  flex;
  flex-direction: column;
  gap:      6px;
}

.news-card {
  display:  block;
  border-radius: var(--r2);
  background: var(--card);
  border:    1px solid var(--border);
  overflow:  hidden;
  transition: all .15s;
}
.news-card:hover {
  border-color: var(--border2);
  background:   var(--card2);
  transform:    translateY(-1px);
  box-shadow:   var(--shadow);
}

.news-inner {
  display: flex;
  gap:     10px;
  padding: 10px 12px;
}

.news-thumb {
  width:        64px;
  height:       50px;
  object-fit:   cover;
  border-radius: 6px;
  flex-shrink:  0;
  background:   var(--border);
}
.no-thumb .news-thumb { display: none; }

.news-body { flex: 1; min-width: 0; }

.news-meta {
  display:     flex;
  align-items: center;
  gap:         5px;
  margin-bottom: 5px;
}
.news-src  { font-size: 10.5px; font-weight: 600; color: var(--accent2); }
.news-dot  { color: var(--muted); font-size: 10px; }
.news-time { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

.news-headline {
  font-size:   12.5px;
  font-weight: 500;
  color:       var(--text);
  line-height: 1.45;
  display:     -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow:    hidden;
  margin-bottom: 7px;
}

.news-tags { display: flex; gap: 5px; flex-wrap: wrap; }

.ntag {
  font-size:   10px;
  font-weight: 600;
  padding:     1px 7px;
  border-radius: 4px;
  border:      1px solid transparent;
  letter-spacing: .3px;
}
.sector-ntag {
  background: var(--card2);
  color:      var(--muted);
  border-color: var(--border);
}

.news-empty {
  flex:            1;
  display:         flex;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  gap:             10px;
  padding:         40px;
  color:           var(--muted);
  font-size:       13px;
}
.news-empty-icon { font-size: 32px; opacity: .5; }

/* ═══════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════ */
.toast {
  position:    fixed;
  bottom:      24px;
  left:        50%;
  transform:   translateX(-50%) translateY(12px);
  padding:     10px 20px;
  border-radius: 24px;
  font-size:   13px;
  font-weight: 500;
  opacity:     0;
  pointer-events: none;
  transition:  all .3s cubic-bezier(.34,1.56,.64,1);
  z-index:     100;
  white-space: nowrap;
  box-shadow:  var(--shadow);
}
.toast.visible  { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.info     { background: var(--card2); color: var(--text2); border: 1px solid var(--border2); }
.toast.success  { background: #0d3320; color: var(--green);  border: 1px solid #22d87a40; }
.toast.error    { background: #2d0d18; color: var(--red);    border: 1px solid #f0507040; }

/* ═══════════════════════════════════════════════════════════
   MISC UTILS
══════════════════════════════════════════════════════════ */
.divider { width: 1px; height: 20px; background: var(--border); }
</style>
</head>
<body>

<div class="app-shell">

  <!-- ── HEADER ──────────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-mark">📈</div>
      <div>
        <div class="logo-text">MarketDesk</div>
        <div class="logo-sub">NSE · BSE Screener</div>
      </div>
    </div>

    <div class="header-mid"></div>

    <div class="header-right">
      <span id="market-status" class="market-status closed">○ Market Closed</span>
      <div class="divider"></div>
      <span id="clock">--:--:--</span>
      <div class="divider"></div>
      <span id="last-updated" style="font-size:11px;color:var(--muted)">Not yet updated</span>
      <button id="refresh-btn" class="refresh-btn" title="Manual refresh (also auto-refreshes every 5 min)">
        <span id="refresh-icon" class="refresh-icon">↻</span>
        Refresh
      </button>
    </div>
  </header>

  <!-- ── SUMMARY STRIP ───────────────────────────────────────────── -->
  <div class="summary-strip">
    <div class="stat-card">
      <span class="stat-label">Tracking</span>
      <span class="stat-val" id="stat-tracking">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Gainers ▲</span>
      <span class="stat-val green" id="stat-gainers">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Losers ▼</span>
      <span class="stat-val red" id="stat-losers">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Avg Day Chg</span>
      <span class="stat-val" id="stat-avg">—</span>
    </div>
  </div>

  <!-- ── MAIN AREA ────────────────────────────────────────────────── -->
  <div class="main-area">

    <!-- LEFT: Screener ──────────────────────────────────────────── -->
    <section class="screener-panel">

      <div class="screener-toolbar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="search" type="text" placeholder="Search stocks…" autocomplete="off" spellcheck="false">
        </div>
        <div id="sector-filters"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Symbol</th>
              <th class="sort-th" data-col="name">Company</th>
              <th class="sort-th" data-col="price">Price</th>
              <th class="sort-th desc" data-col="changePercent">Day %</th>
              <th class="sort-th" data-col="change">Change</th>
              <th class="sort-th" data-col="volume">Volume</th>
              <th class="sort-th" data-col="mcap">Mkt Cap</th>
              <th>52W Range</th>
              <th>Sector</th>
            </tr>
          </thead>
          <tbody id="stock-tbody">
            <!-- rendered by JS -->
          </tbody>
        </table>
      </div>

    </section>

    <!-- RIGHT: News inbox ─────────────────────────────────────── -->
    <section class="news-panel">

      <div class="news-header">
        <div class="news-title-row">
          <span class="news-title">News Inbox</span>
          <span id="news-count">0</span>
          <span class="news-hint">Click a row to filter ↓</span>
        </div>
        <div id="news-tabs"></div>
      </div>

      <div id="news-list">
        <div class="news-empty">
          <div class="news-empty-icon">📰</div>
          <p>Fetching news…</p>
        </div>
      </div>

    </section>

  </div><!-- /.main-area -->

</div><!-- /.app-shell -->

<div id="toast" class="toast"></div>

<script src="screener-config.js"></script>
<script src="screener-app.js"></script>
</body>
</html>
